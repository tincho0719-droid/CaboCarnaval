<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabo - Juego de Cartas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f0f0f0; text-align: center; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .pantalla { display: none; width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        .activa { display: block; }
        h1 { color: #f39c12; letter-spacing: 2px; }
        input { padding: 12px; font-size: 16px; margin: 10px 0; width: 80%; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; text-align: center; }
        button { padding: 12px 24px; font-size: 18px; margin: 10px; cursor: pointer; background-color: #f39c12; color: #1a1a1a; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #d68910; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .lista-jugadores { background: #2a2a2a; border-radius: 10px; padding: 15px; margin: 20px 0; text-align: left; }
        .jugador-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; }
        .estado-listo { color: #2ecc71; font-weight: bold; }
        .estado-espera { color: #e74c3c; }
        /* Diseño de la Mesa y las Cartas */
        .mesa-redonda { width: 100%; max-width: 800px; margin: 20px auto; padding: 40px; background-color: #2c3e50; border-radius: 50%; border: 8px solid #34495e; min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .centro-mesa { margin: 20px 0; }
        .zona-jugador { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .grilla-cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .carta-juego { width: 60px; height: 90px; background-color: #ecf0f1; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 14px; border: 2px solid #bdc3c7; user-select: none; }
        .carta-oculta { background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 10px, #c0392b 10px, #c0392b 20px); color: transparent; }
        .carta-roja { color: #e74c3c; }
        .carta-negra { color: #2c3e50; }
        /* --- ADAPTACIÓN PARA CELULARES (Responsive) --- */
        @media (max-width: 600px) {
            body { padding: 10px; }
            
            .mesa-redonda {
                width: 95%;
                border-radius: 25px; /* Dejamos de forzar el círculo para ganar espacio */
                padding: 15px;
                min-height: auto;
                border-width: 4px;
            }
            
            .carta-juego {
                width: 50px; /* Cartas ligeramente más pequeñas */
                height: 75px;
                font-size: 12px;
            }
            
            .grilla-cartas {
                gap: 5px; /* Menos espacio entre cartas */
            }

            input { width: 90%; }
        }
        /* Contenedor para alinear a todos los rivales arriba */
        #zona-oponentes {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* Bloque individual de cada oponente */
        .oponente-bloque {
            background-color: #34495e;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #bdc3c7;
            text-align: center;
            min-width: 100px;
        }

        .oponente-nombre {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #f39c12;
        }

        /* Grilla pequeña para representar las 4 cartas tapadas del rival */
        .grilla-cartas-oponente {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            justify-items: center;
        }

        .carta-oponente-oculta {
            width: 30px;
            height: 45px;
            background: repeating-linear-gradient(45deg, #3498db, #3498db 5px, #2980b9 5px, #2980b9 10px);
            border-radius: 4px;
            border: 1px solid #ecf0f1;
        }
        .zona-mazos { display: flex; gap: 20px; justify-content: center; margin-top: 10px; }
        #indicador-turno { color: #f1c40f; font-weight: bold; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="pantalla-login" class="pantalla activa">
        <h1>CABO</h1>
        <p>Ingresa tu nombre y el código de la partida</p>
        <input type="text" id="input-nombre" placeholder="Tu Nombre (Ej: Martín)">
        <input type="text" id="input-sala" placeholder="Código de la Sala (Ej: mesa1)">
        <button id="btn-entrar">Unirse a la Sala</button>
    </div>

    <div id="pantalla-lobby" class="pantalla">
        <h2>Sala: <span id="nombre-sala"></span></h2>
        <p>Esperando a los jugadores...</p>
        
        <div class="lista-jugadores" id="lista-jugadores">
            </div>

        <button id="btn-listo">¡Estoy Listo!</button>
    </div>

    <div id="pantalla-juego" class="pantalla">
        <div class="mesa-redonda">
            
            <div id="zona-oponentes">Esperando oponentes...</div>

            <div class="centro-mesa">
                <div id="indicador-turno">Turno de: ...</div>
                <div class="zona-mazos">
                    <div id="mazo-robar" class="carta-juego carta-oculta" style="cursor: pointer;">
                        MAZO
                    </div>
                    <div id="carta-centro" class="carta-juego"></div>
                </div>
            </div>

            <div class="zona-jugador">
                <h3>Tus Cartas</h3>
                <div class="grilla-cartas" id="mis-cartas-html">
                    </div>
                <button id="btn-ver-cartas" style="display: none;">Ver mis cartas inferiores (3s)</button>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
        let miSala = '';

        // Elementos UI
        const btnEntrar = document.getElementById('btn-entrar');
        const btnListo = document.getElementById('btn-listo');
        const inputNombre = document.getElementById('input-nombre');
        const inputSala = document.getElementById('input-sala');
        const divListaJugadores = document.getElementById('lista-jugadores');

        // Unirse al Lobby
        btnEntrar.addEventListener('click', () => {
            const nombre = inputNombre.value.trim();
            miSala = inputSala.value.trim();

            if (nombre && miSala) {
                socket.emit('unirse_lobby', { codigoSala: miSala, nombreJugador: nombre });
                
                document.getElementById('pantalla-login').classList.remove('activa');
                document.getElementById('pantalla-lobby').classList.add('activa');
                document.getElementById('nombre-sala').innerText = miSala;
            }
        });

        // Marcar Listo
        btnListo.addEventListener('click', () => {
            socket.emit('jugador_listo', miSala);
            btnListo.disabled = true;
            btnListo.innerText = "Esperando al resto...";
        });

        // Escuchar actualización del lobby
        socket.on('actualizar_lobby', (jugadores) => {
            divListaJugadores.innerHTML = '';
            jugadores.forEach(j => {
                const estadoDiv = j.listo ? '<span class="estado-listo">Listo</span>' : '<span class="estado-espera">Esperando...</span>';
                divListaJugadores.innerHTML += `<div class="jugador-item"><span>${j.nombre}</span> ${estadoDiv}</div>`;
            });
        });

        // Escuchar inicio de juego, procesar oponentes y carta central
        socket.on('iniciar_juego', (datos) => {
            document.getElementById('pantalla-lobby').classList.remove('activa');
            document.getElementById('pantalla-juego').classList.add('activa');
            
            // 1. Mostrar la carta del centro
            const divCentro = document.getElementById('carta-centro');
            const colorClase = datos.cartaCentro.color === 'Rojo' ? 'carta-roja' : 'carta-negra';
            divCentro.innerHTML = `${datos.cartaCentro.valor}<br>${datos.cartaCentro.palo.substring(0,3)}`;
            divCentro.className = `carta-juego ${colorClase}`;

            // 2. Dibujar dinámicamente a los oponentes
            const divOponentes = document.getElementById('zona-oponentes');
            divOponentes.innerHTML = ''; // Limpiamos el texto "Esperando oponentes..."

            // Filtramos la lista para quedarnos solo con los DEMÁS jugadores
            const oponentes = datos.jugadores.filter(j => j.id !== socket.id);

            oponentes.forEach(op => {
                divOponentes.innerHTML += `
                    <div class="oponente-bloque" id="oponente-${op.id}">
                        <div class="oponente-nombre">${op.nombre}</div>
                        <div class="grilla-cartas-oponente">
                            <div class="carta-oponente-oculta"></div>
                            <div class="carta-oponente-oculta"></div>
                            <div class="carta-oponente-oculta"></div>
                            <div class="carta-oponente-oculta"></div>
                        </div>
                    </div>
                `;
            });
            // 3. Actualizar indicador de turno visual
            const indicadorTurno = document.getElementById('indicador-turno');
            if (datos.turnoActualId === socket.id) {
                indicadorTurno.innerText = "¡ES TU TURNO!";
                indicadorTurno.style.color = "#2ecc71"; // Verde
            } else {
                indicadorTurno.innerText = `Turno de: ${datos.turnoActualNombre}`;
                indicadorTurno.style.color = "#f1c40f"; // Amarillo
            }
        });

        // Recibir MIS 4 cartas en privado
        socket.on('mis_cartas', (cartas) => {
            const miGrilla = document.getElementById('mis-cartas-html');
            miGrilla.innerHTML = ''; // Limpiamos

            // Guardamos los datos de la carta ocultos usando 'data-' atributos
            cartas.forEach((carta, index) => {
                miGrilla.innerHTML += `
                    <div class="carta-juego carta-oculta" id="mi-carta-${index}" 
                         data-valor="${carta.valor}" 
                         data-palo="${carta.palo}" 
                         data-color="${carta.color}">
                        ?
                    </div>
                `;
            });

            // Mostramos el botón para iniciar la memorización
            document.getElementById('btn-ver-cartas').style.display = 'block';
        });

        // LÓGICA DEL BOTÓN DE 3 SEGUNDOS
        const btnVerCartas = document.getElementById('btn-ver-cartas');
        btnVerCartas.addEventListener('click', () => {
            // 1. Ocultamos el botón para que no lo presionen dos veces
            btnVerCartas.style.display = 'none';
            
            // 2. Identificamos las dos cartas de abajo (índices 2 y 3 de la grilla)
            const cartaIzq = document.getElementById('mi-carta-2');
            const cartaDer = document.getElementById('mi-carta-3');

            // Función para dar vuelta una carta
            const revelar = (divCarta) => {
                divCarta.classList.remove('carta-oculta');
                const colorClase = divCarta.dataset.color === 'Rojo' ? 'carta-roja' : 'carta-negra';
                divCarta.classList.add(colorClase);
                divCarta.innerHTML = `${divCarta.dataset.valor}<br>${divCarta.dataset.palo.substring(0,3)}`;
            };

            // Función para volver a tapar
            const tapar = (divCarta) => {
                divCarta.classList.add('carta-oculta');
                divCarta.classList.remove('carta-roja', 'carta-negra');
                divCarta.innerHTML = '?';
            };

            // 3. Revelamos las cartas inferiores
            revelar(cartaIzq);
            revelar(cartaDer);

            // 4. Temporizador estricto de 3000 milisegundos (3 segundos)
            setTimeout(() => {
                tapar(cartaIzq);
                tapar(cartaDer);
                // Acá el jugador ya está listo para jugar
            }, 3000);
        }); 
        // --- LÓGICA DE TURNOS E INTERACCIÓN ---

        // 1. Al hacer clic en el mazo central
        const mazoRobar = document.getElementById('mazo-robar');
        mazoRobar.addEventListener('click', () => {
            socket.emit('robar_carta_turno', miSala);
        });

        // 2. El servidor nos da la carta (solo si es nuestro turno)
        socket.on('recibir_carta_robada', (carta) => {
            // Por ahora, usamos un alert simple para verificar que funciona
            // En el próximo paso crearemos los botones de "Descartar" o "Cambiar"
            alert(`¡Es tu turno!\nLevantaste la carta: ${carta.valor} de ${carta.palo}`);
        });

        // 3. Mostrar mensajes generales en la consola para depurar
        socket.on('mensaje_juego', (mensaje) => {
            console.log("Sistema:", mensaje);
        }); 
    </script>
</body>
</html>
